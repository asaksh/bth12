 for(let i=0;i<8;i++){const q=Math.PI+(i+.5)*Math.PI/8,x=cx+Math.cos(q)*rx*.87,y=cy+Math.sin(q)*ry*.87;LG.save();LG.translate(Math.round(x),Math.round(y));LG.rotate(q+Math.PI/2);LG.fillText('封結界古印守師道'[i],0,0);LG.restore()}

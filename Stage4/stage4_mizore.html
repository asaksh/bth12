<style>

<script>
const $=i=>document.getElementById(i),C=$('c'),g=C.getContext('2d'),W=320,H=360,TAU=Math.PI*2,R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const COL=['#46c8ff','#ffffff','#7ff0ff','#9fdcff','#c8f6ff'];
const MP={h:['.XX.XX.','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..','...X...'],s:['...X...','...X...','XXXXXXX','.XXXXX.','..XXX..','.XX.XX.','.X...X.'],b:['..XXX..','.XXXXX.','XXXXXXX','XXXXXXX','XXXXXXX','.XXXXX.','..XXX..']};
const ic=(m,c,s)=>{const o=document.createElement('canvas');o.width=m[0].length*s;o.height=m.length*s;const x=o.getContext('2d');x.fillStyle=c;m.forEach((r,j)=>[...r].forEach((h,i)=>h=='X'&&x.fillRect(i*s,j*s,s,s)));return o};
const U={h:ic(MP.h,'#ff4d6d',3).toDataURL(),H:ic(MP.h,'#3a2c45',3).toDataURL(),b:ic(MP.b,'#5ec8ff',3).toDataURL(),B:ic(MP.b,'#2a3445',3).toDataURL()};
const SI=ic(MP.s,'#ffd93a',2),BI=ic(MP.b,'#5ec8ff',2);

/* ---------- DIALOGUE (p = protagonist, m = Mizore, n = narration) ---------- */
const INTRO=[
 {sp:'m',en:"You're here!",jp:'来たのね！',boss:0},
 {sp:'p',en:'...',jp:'……',boss:0},
 {sp:'m',en:"I'm talking to you! Hey!",jp:'あなたに話しかけてるの！ ねえ！',boss:0},
 {sp:'p',en:"Kid, that's not how hide-and-seek works. I can literally find you.",jp:'子供、かくれんぼはそういう遊びじゃないわ。私、普通にあなたを見つけられるのよ。',boss:0},
 {appear:1,boss:1},
 {sp:'m',en:"It's me! Shigure's little sister, Mizore!",jp:'わたしよ！ 時雨お姉ちゃんの妹、霙！',boss:1},
 {sp:'p',en:'Amazing. Another nuisance.',jp:'素晴らしいわね。また厄介者が増えたわ。',boss:1},
 {sp:'m',en:"That's rude! Why would you greet your playmate like that?",jp:'ひどい！ 遊び友達にそんな挨拶ってある？',boss:1},
 {sp:'p',en:'What? You want some long dialogue before we fight?',jp:'は？ 戦う前に長々とお喋りでもしたいの？',boss:1},
 {sp:'m',en:"Why not? We should play together for a while first! I'll be happy!",jp:'いいじゃない！ まずはちょっと一緒に遊ぼうよ！ そしたらうれしいな！',boss:1},
 {sp:'p',en:'Oh, great. A nuisance, for real.',jp:'ああ、最高ね。本当に厄介だわ。',boss:1},
 {sp:'m',en:"Hehe! I haven't had a playmate in centuries!",jp:'えへへ！ 何百年ぶりの遊び相手なんだもん！',boss:1}
];
const DEFEAT=[
 {sp:'m',en:"I'm tiiiiiiiireeed!!",jp:'つかれたぁぁぁぁ！！',boss:1},
 {sp:'m',en:'Can I rest for a bit?',jp:'ちょっと休んでもいい？',boss:1},
 {sp:'m',en:'Maybe we can play again later!',jp:'またあとで遊べるかもね！',boss:1},
 {sp:'p',en:'Sure.',jp:'ええ、いいわよ。',boss:1}
];
const POST=[
 {sp:'m',en:'Say, why are you travelling so far?',jp:'ねえ、どうしてそんなに遠くまで旅してるの？',boss:1},
 {sp:'p',en:'I have somewhere to be.',jp:'行かなければならない場所があるのよ。',boss:1},
 {sp:'m',en:'Somewhere? Is it really that important?',jp:'場所？ そんなに大事なことなの？',boss:1},
 {sp:'p',en:'Important enough.',jp:'それなりにはね。',boss:1},
 {sp:'m',en:"Hehe. That's funny.",jp:'えへへ。おかしいの。',boss:1},
 {sp:'p',en:"What's so funny?",jp:'何がおかしいのよ？',boss:1},
 {sp:'m',en:'Everyone has somewhere to go. Everyone has something to protect. And eventually, it all disappears.',jp:'みんな行く場所があって、守りたいものがあって。でも最後には、全部消えちゃうの。',boss:1},
 {sp:'m',en:'So why bother?',jp:'じゃあ、どうしてがんばるの？',boss:1},
 {sp:'p',en:'...',jp:'……',boss:1},
 {sp:'p',en:'I will come back in a bit.',jp:'少ししたら、また来るわ。',boss:1}
];

/* ---------- DIFFICULTIES ---------- */
const DIFFS=[
 {id:'easy',en:'Easy',jp:'イージー',lives:5,cont:6,bombs:3,spd:.68,rate:1.4,hpMul:.78,dropChance:1,lifeChance:.45,thr:[.66,.33],descEn:'Gentler patterns · +3 extra continues',descJp:'穏やかな弾幕 · コンティニュー+3'},
 {id:'normal',en:'Normal',jp:'ノーマル',lives:5,cont:3,bombs:3,spd:.82,rate:1.18,hpMul:.9,dropChance:.65,lifeChance:.3,thr:[.5],descEn:'Standard danmaku experience · balanced drops',descJp:'標準的な弾幕体験 · バランスの良いドロップ'},
 {id:'hard',en:'Hard',jp:'ハード',lives:4,cont:2,bombs:2,spd:1,rate:.98,hpMul:1.05,dropChance:.45,lifeChance:.22,thr:[.5],descEn:'Faster bullets, denser weaves · scarce drops',descJp:'より速く、より密な弾幕 · ドロップ希少'},
 {id:'extreme',en:'Extreme',jp:'エクストリーム',lives:3,cont:1,bombs:2,spd:1.16,rate:.82,hpMul:1.2,dropChance:.3,lifeChance:.15,thr:[],descEn:'Relentless speed and density · minimal drops',descJp:'容赦ない速度と密度 · ドロップ極小'},
 {id:'nohit',en:'No Hit',jp:'ノーヒット',lives:1,cont:0,bombs:1,spd:.95,rate:1.05,hpMul:.9,dropChance:.2,lifeChance:0,thr:[],descEn:'Hit yourself once and the run is no more!',descJp:'一度でも当たれば挑戦は終了！'}
];
let diffIdx=1,shakeOn=true;
const curDiff=()=>DIFFS[diffIdx];

/* ---------- AUDIO ---------- */
const vol={overall:.8,music:.7,sfx:.75};
const bgm1=new Audio('stage4_theme.mp3');bgm1.loop=true;
const vic=new Audio('victory.mp3');vic.loop=false;
let curBgm=null,actx=null,sfxGain=null,masterGain=null,lastShotSfx=0,lastHitSfx=0,lastGrazeSfx=0,vicTimer=null;
let mdim=1,mdTarget=1,mdRate=1,wind=null,windMute=false;
function initAudio(){
 if(!actx){const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){actx=new AC();masterGain=actx.createGain();sfxGain=actx.createGain();sfxGain.connect(masterGain);masterGain.connect(actx.destination)}}
 if(actx&&actx.state==='suspended')actx.resume();
 applyVol();
}
function applyVol(){
 const mv=Math.max(0,Math.min(1,vol.music*vol.overall*mdim));
 bgm1.volume=mv;vic.volume=Math.max(0,Math.min(1,vol.music*vol.overall));
 if(masterGain&&sfxGain){masterGain.gain.value=vol.overall;sfxGain.gain.value=vol.sfx}
 if(wind)wind.wg.gain.value=windMute?0:vol.sfx*.9;
}
function fadeMusic(to,secs){mdTarget=to;mdRate=1/Math.max(.01,secs)}
function mixStep(dt){
 if(mdim===mdTarget)return;
 const st=mdRate*dt;mdim=mdim<mdTarget?Math.min(mdTarget,mdim+st):Math.max(mdTarget,mdim-st);
 applyVol();
 if(mdim<=.001&&mdTarget===0)stopBgm();
}
function startWind(){
 initAudio();if(!actx||wind)return;
 const len=actx.sampleRate*3,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);let last=0;
 for(let i=0;i<len;i++){last=last*.97+(Math.random()*2-1)*.03;d[i]=last*6}
 const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
 const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.7;
 const gn=actx.createGain();gn.gain.value=.55;
 const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.13;lg.gain.value=.3;lfo.connect(lg);lg.connect(gn.gain);
 const wg=actx.createGain();wg.gain.value=0;
 src.connect(f);f.connect(gn);gn.connect(wg);wg.connect(masterGain);
 src.start();lfo.start();
 wind={src,lfo,wg};windMute=false;
 wg.gain.setValueAtTime(0,actx.currentTime);wg.gain.linearRampToValueAtTime(vol.sfx*.9,actx.currentTime+3);
}
function stopWind(){
 if(!wind)return;
 const w=wind;wind=null;
 try{w.wg.gain.cancelScheduledValues(actx.currentTime);w.wg.gain.setValueAtTime(w.wg.gain.value,actx.currentTime);w.wg.gain.linearRampToValueAtTime(0,actx.currentTime+.6);
  setTimeout(()=>{try{w.src.stop();w.lfo.stop()}catch(e){}},700)}catch(e){}
}
function playBgm(track){stopBgm();curBgm=track;applyVol();curBgm.currentTime=0;curBgm.play().catch(()=>{})}
function pauseBgm(){if(curBgm)curBgm.pause();windMute=true;applyVol()}
function resumeBgm(){if(curBgm){applyVol();curBgm.play().catch(()=>{})}windMute=false;applyVol()}
function stopBgm(){bgm1.pause();bgm1.currentTime=0;curBgm=null}
function sfx(type){
 initAudio();
 if(!actx||vol.sfx*vol.overall<=0.001)return;
 const now=actx.currentTime;
 const tone=(wave,f0,f1,dur,gainVal,delay=0)=>{
  const o=actx.createOscillator(),gn=actx.createGain();o.type=wave;
  o.frequency.setValueAtTime(f0,now+delay);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),now+delay+dur);
  gn.gain.setValueAtTime(gainVal,now+delay);gn.gain.exponentialRampToValueAtTime(0.0008,now+delay+dur);
  o.connect(gn);gn.connect(sfxGain);o.start(now+delay);o.stop(now+delay+dur+.01);
 };
 const noise=(dur,gainVal,freq=1200,delay=0)=>{
  const len=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=actx.createBufferSource(),flt=actx.createBiquadFilter(),gn=actx.createGain();
  src.buffer=buf;flt.type='bandpass';flt.frequency.value=freq;
  gn.gain.setValueAtTime(gainVal,now+delay);gn.gain.exponentialRampToValueAtTime(0.0008,now+delay+dur);
  src.connect(flt);flt.connect(gn);gn.connect(sfxGain);src.start(now+delay);
 };
 if(type==='shot'){if(now-lastShotSfx<.065)return;lastShotSfx=now;tone('triangle',1320,460,.04,.09)}
 else if(type==='hit'){if(now-lastHitSfx<.055)return;lastHitSfx=now;tone('square',240,115,.035,.07)}
 else if(type==='graze'){if(now-lastGrazeSfx<.04)return;lastGrazeSfx=now;tone('sawtooth',2200,3400,.028,.07);noise(.025,.05,3500)}
 else if(type==='pichuun'){tone('sawtooth',1650,95,.46,.22);tone('sine',980,65,.42,.2,.02);noise(.28,.16,800)}
 else if(type==='bomb'){tone('sawtooth',220,880,.28,.18);tone('triangle',440,1320,.45,.16,.05);noise(.5,.22,600)}
 else if(type==='spell'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone('triangle',f,f*1.02,.25,.14,i*.045));noise(.18,.1,2200)}
 else if(type==='break'){tone('sawtooth',660,180,.35,.18);[523.25,783.99,1046.5].forEach((f,i)=>tone('sine',f,f,.35,.13,i*.04));noise(.32,.18,900)}
 else if(type==='item'){tone('sine',980,1480,.06,.12);tone('sine',1480,1960,.08,.1,.045)}
 else if(type==='select'){tone('square',660,880,.04,.08)}
 else if(type==='ok'){tone('triangle',880,1320,.08,.12)}
 else if(type==='pause'){tone('square',520,390,.07,.1);tone('square',390,260,.08,.09,.05)}
}

let S,HI=0,st0=0,DT=1/60,K={},paused=false,pausedMode='';
const ev=(k,iv,f)=>{const sc=S.ph<10?curDiff().rate:1;S.cd[k]=(S.cd[k]??0)-DT;if(S.cd[k]<=0){S.cd[k]+=iv*sc;f()}};
const aim=o=>Math.atan2(S.p.y-o.y,S.p.x-o.x);
const Bu=(x,y,a,sp,o)=>{const sc=S.ph<10?curDiff().spd:1;S.bl.push({x,y,vx:Math.cos(a)*sp*sc,vy:Math.sin(a)*sp*sc,r:2,c:'#fff',k:'o',age:0,...o})};
const Ls=o=>S.ls.push({x:0,y:0,a:0,da:0,warn:.8,on:.7,t:0,...o});
const once=n=>S.fg[n]?0:(S.fg[n]=1);
const fxp=(x,y,col)=>S.fx.push({x,y,t:0,col:col||'170,240,255'});

function mazeGen(){
 const N=8,Cc=40,Y0=40,vis=new Set(['0,7']),open=new Set(),st=[[0,7]];
 while(st.length){const [c,r]=st[st.length-1];
  const nb=[[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N&&!vis.has(a+','+b));
  if(!nb.length){st.pop();continue}
  const [a,b]=nb[Math.random()*nb.length|0];vis.add(a+','+b);open.add(c+','+r+'|'+a+','+b);open.add(a+','+b+'|'+c+','+r);st.push([a,b])}
 const w=[{x:-2,y:Y0-2,w:W+4,h:4}];
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  if(c<N-1&&!open.has(c+','+r+'|'+(c+1)+','+r))w.push({x:(c+1)*Cc-2,y:Y0+r*Cc-2,w:4,h:Cc+4});
  if(r<N-1&&!open.has(c+','+r+'|'+c+','+(r+1)))w.push({x:c*Cc-2,y:Y0+(r+1)*Cc-2,w:Cc+4,h:4})}
 return{w,open,N,C:Cc,Y0,gx:7,gy:0};
}
function mazePath(M,p){

 while(q.length){const [c,r]=q.shift();if(c===M.gx&&r===M.gy)break;
  for(const [a,b] of [[c+1,r],[c-1,r],[c,r+1],[c,r-1]]){if(a<0||a>7||b<0||b>7||(key(a,b) in prev)||!M.open.has(key(c,r)+'|'+key(a,b)))continue;prev[key(a,b)]=[c,r];q.push([a,b])}}
 let cur=[M.gx,M.gy],nxt=null;
 if(!((M.gx+','+M.gy) in prev))return{x:M.gx*C+C/2,y:M.Y0+M.gy*C+C/2};
 while(prev[key(cur[0],cur[1])]){nxt=cur;cur=prev[key(cur[0],cur[1])]}
 const t=nxt||[M.gx,M.gy];return{x:t[0]*C+C/2,y:M.Y0+t[1]*C+C/2};
}

 put('tm',(s.mode=='play'||s.mode=='pause')&&s.time<1000?Math.ceil(s.time):'--');
}
let acc=0,lt=0;
function loop(ts){const dt=Math.min(.1,(ts-lt)/1000||0);acc+=dt;lt=ts;mixStep(dt);while(acc>=1/60){upd(1/60);acc-=1/60}draw();hud();requestAnimationFrame(loop)}

/* ---------- INPUT ---------- */
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();K[k]=1;
 if(k.startsWith('arrow')||k==' ')e.preventDefault();
 if(e.repeat)return;
 if(k=='escape'){togglePause();return}
 if(S.mode=='title'){
  if(k=='arrowup'||k=='w'){diffIdx=(diffIdx+DIFFS.length-1)%DIFFS.length;sfx('select');syncDiffStats();renderTitle();return}
  if(k=='arrowdown'||k=='s'){diffIdx=(diffIdx+1)%DIFFS.length;sfx('select');syncDiffStats();renderTitle();return}
 }
 if(k=='z'||k=='enter'){if(S.mode!='play')act()}
 if(k=='x')bomb();
 if(k=='r')reset();
});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
let lp=null;
C.addEventListener('pointerdown',e=>{lp=[e.clientX,e.clientY];if(e.pointerType!='mouse')touchActive=true;if(S.mode!='play'&&S.mode!='pause')act()});
addEventListener('pointerup',()=>{lp=null;touchActive=false});
C.addEventListener('pointermove',e=>{
 if(lp&&S.mode=='play'&&e.pointerType!='mouse'){
  const k=W/C.clientWidth,bd=pb();
  movP(cl(S.p.x+(e.clientX-lp[0])*k,bd.x0,bd.x1),cl(S.p.y+(e.clientY-lp[1])*k,bd.y0,bd.y1));
  lp=[e.clientX,e.clientY];
 }
});
$('bb').onclick=bomb;$('bz').onclick=act;$('bp').onclick=()=>togglePause();
reset();requestAnimationFrame(loop);
</script></body></html>
